<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Study Tracker</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">

  <!-- Математика -->
  <div class="card">
    <h2>📐 Математика (Профиль)</h2>
    <div class="progress">
      <div class="progress-inner" id="mathProgress"></div>
    </div>

    <div class="block">
      <h3>I часть</h3>
      <div class="grid" id="math1"></div>
    </div>

    <div class="block">
      <h3>II часть</h3>
      <div class="grid" id="math2"></div>
    </div>
  </div>

  <!-- Русский -->
  <div class="card">
    <h2>📖 Русский</h2>
    <div class="progress">
      <div class="progress-inner" id="rusProgress"></div>
    </div>

    <div class="block">
      <h3>I часть</h3>
      <div class="grid" id="rus1"></div>
    </div>

    <div class="block">
      <h3>II часть</h3>
      <div class="grid" id="rus2"></div>
    </div>
  </div>

  <!-- Информатика -->
  <div class="card">
    <h2>💻 Информатика</h2>
    <div class="progress">
      <div class="progress-inner" id="infProgress"></div>
    </div>
    <div class="grid" id="inf"></div>
  </div>

</div>

<script src="script.js"></script>
</body>
</html>
